[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=62.4.0", "wheel" ]

[project]
authors = [ { email = "runar.tenfjord@gmail.com", name = "Runar Tenfjord" } ]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
description = "Parser for the ECS Oberon variant (Oberon-2)"
keywords = [ "incremental", "parsing", "tree-sitter", "ecsoberon" ]
license.text = "MIT"
name = "tree-sitter-ecsoberon"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.urls]
Funding = ""
Homepage = "https://github.com/tree-sitter/tree-sitter-ecsoberon"

[project.optional-dependencies]
core = [ "tree-sitter~=0.24" ]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
